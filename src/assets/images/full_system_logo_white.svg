    </text>

    <!-- Subtitle: COSTA RICA | SISTEMA DE DOSIFICACIÓN -->
    <text x="1" y="49" 
          font-family="system-ui, -apple-system, 'Montserrat', 'Segoe UI', Arial, sans-serif" 
          font-size="11" 
          font-weight="800" 
          letter-spacing="1.2" 
          fill="#2DD4BF">
