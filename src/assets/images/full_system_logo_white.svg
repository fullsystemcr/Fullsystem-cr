    <line x1="86" y1="40" x2="86" y2="50" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>

    <text x="94" y="49" 
          font-family="system-ui, -apple-system, 'Montserrat', 'Segoe UI', Arial, sans-serif" 
          font-size="10.5" 
          font-weight="700" 
          letter-spacing="0.8" 
