<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%" fill="none">
  <!-- FULL SYSTEM COSTA RICA - AUTHENTIC WHITE LOGO (For dark backgrounds) -->
  
  <!-- Icon: Rounded Dark Teal Square with FU-DOSE Twin-Neck Doser Bottle Silhouette -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#0E3944"/>
    <rect x="0" y="0" width="56" height="56" rx="14" stroke="#14B8A6" stroke-width="1.5" fill="none"/>

    <path d="M 14 26 C 14 25, 15 24, 16 24 L 32 24 C 33 24, 34 25, 34 26 L 34 47 C 34 49, 33 50, 31 50 L 17 50 C 15 50, 14 49, 14 47 Z" fill="#00D2B4" fill-opacity="0.85"/>
    <path d="M 14 34 L 34 34 L 34 47 C 34 49, 33 50, 31 50 L 17 50 C 15 50, 14 49, 14 47 Z" fill="#00FFD1"/>
    
    <rect x="15" y="12" width="4" height="13" rx="1.5" fill="#FFFFFF"/>
    <rect x="23" y="10" width="14" height="15" rx="3" fill="#FFFFFF"/>
    <rect x="24.5" y="14" width="11" height="9" rx="1.5" fill="#00D2B4"/>
    
    <line x1="25.5" y1="16" x2="28" y2="16" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="25.5" y1="19" x2="29" y2="19" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="25.5" y1="21.5" x2="27.5" y2="21.5" stroke="#FFFFFF" stroke-width="1"/>

    <rect x="26" y="6" width="8" height="4.5" rx="1" fill="#FF4444"/>
    <rect x="14" y="9" width="6" height="3.5" rx="1" fill="#FF4444"/>
    <circle cx="43" cy="14" r="2" fill="#00FFD1"/>
  </g>

  <!-- Wordmark in White & Teal -->
  <g transform="translate(70, 0)">
    <!-- FULL SYSTEM -->
    <text x="0" y="32" 
          font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Segoe UI', Arial, sans-serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="0.5" 
          fill="#FFFFFF">
      FULL SYSTEM
    </text>
    
    <!-- ® Registered Trademark in Bright Teal -->
    <text x="210" y="23" 
          font-family="system-ui, -apple-system, 'Montserrat', Arial, sans-serif" 
          font-size="14" 
          font-weight="800" 
          fill="#2DD4BF">
